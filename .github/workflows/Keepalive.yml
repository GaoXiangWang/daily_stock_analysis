name: Keepalive 保活任务
on:
  schedule:
    # UTC时间，每天0点执行一次检查（每天只检查，不是每天提交！只有超过45天无提交才会生成commit）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点按钮触发测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 保活Action
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          # 45天阈值，距离上次提交超过45天才自动提交空commit，留足缓冲，避免触发60天冻结
          days_before: 45
          commit_message: "🤖 Auto keepalive commit: prevent github cron disable"
          committer_username: github-actions[bot]
          committer_email: github-actions[bot]@users.noreply.github.com
