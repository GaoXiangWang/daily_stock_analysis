name: Keepalive 保活任务
on:
  schedule:
    - cron: '0 0 1 * *'  # 每月1号跑一次，按需改
  workflow_dispatch: # 支持手动触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须给write权限，才能提交空commit
    steps:
      - uses: actions/checkout@v4
      - name: 空提交保活
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive empty commit"
          git push
